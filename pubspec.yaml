name: jelilabel
description: "JeliLabel: pindai label gizi, pantau gula dan natrium harian."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  sqflite: ^2.4.6
  path: ^1.9.1
  get_it: ^9.3.0
  google_mlkit_document_scanner: ^0.7.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_app_check: ^0.5.2
  cloud_functions: ^7.1.0
  google_mobile_ads: ^9.2.0
  image: ^4.13.1
  firebase_ai: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/maskot/

  # Font variabel dibundel (UI-GUIDE: jangan unduh saat jalan). Bobot dipilih lewat FontVariation.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ikon/ikon.png"
  adaptive_icon_background: "#1F7A52"
  adaptive_icon_foreground: "assets/ikon/ikon-depan.png"
  min_sdk_android: 26

flutter_native_splash:
  color: "#FAF8F3"
  image: "assets/ikon/splash.png"
  branding: "assets/ikon/branding.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#FAF8F3"
    image: "assets/ikon/splash-android12.png"
    branding: "assets/ikon/branding.png"
